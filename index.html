<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RZR Gaming</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --rzr-green: #00ff66;
    --rzr-green-soft: #00ff6633;
    --bg: #050505;
    --panel: #0b0b0b;
}

body {
    background: var(--bg);
    color: #eafff3;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* ===== HEADER ===== */
header {
    height: 80px;
    padding: 0 32px;
    display: grid;
    grid-template-columns: 60px 1fr 60px;
    align-items: center;
    border-bottom: 1px solid #00ff6622;
}

#menu {
    font-size: 26px;
    cursor: pointer;
    color: var(--rzr-green);
}

#logo {
    text-align: center;
}
#logo img {
    height: 46px;
}

/* SEARCH BUTTON */
#search {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--rzr-green);
    color: black;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    transition: box-shadow .2s;
}
#search:hover {
    box-shadow: 0 0 18px var(--rzr-green);
}

/* ===== LOGIN ===== */
#loginWrap {
    text-align: center;
    margin: 24px 0 10px;
}
#loginBtn {
    padding: 10px 32px;
    border-radius: 30px;
    background: transparent;
    border: 1px solid var(--rzr-green);
    color: var(--rzr-green);
    cursor: pointer;
}
#loginBtn:hover {
    box-shadow: 0 0 20px var(--rzr-green-soft);
}

/* ===== PRODUCTS ===== */
main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    padding: 60px;
    max-width: 1400px;
    margin: auto;
}

.product {
    background: var(--panel);
    border-radius: 18px;
    padding: 30px;
    cursor: pointer;
    transition: transform .3s, box-shadow .3s;
}
.product:hover {
    transform: translateY(-6px);
    box-shadow: 0 0 40px var(--rzr-green-soft);
}
.product img {
    width: 100%;
    max-height: 320px;
    object-fit: contain;
}
.product h2 {
    margin-top: 20px;
    color: var(--rzr-green);
}

/* ===== BRAND INFO ===== */
#brand {
    max-width: 1000px;
    margin: 80px auto;
    padding: 40px;
    text-align: center;
    border-top: 1px solid #00ff6622;
}

#brand h2 {
    color: var(--rzr-green);
    margin-bottom: 20px;
}
#brand p {
    opacity: 0.85;
    line-height: 1.6;
}

/* ===== OVERLAY ===== */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    z-index: 50;
}

.overlay-content {
    width: 90%;
    max-width: 1200px;
    background: #060606;
    margin: 60px auto;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 0 60px #00ff6644;
}

.close {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 24px;
    cursor: pointer;
    color: var(--rzr-green);
}

.product-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
}

.specs {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 20px;
    margin-top: 30px;
}
.spec {
    background: #0c0c0c;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #00ff6622;
    text-align: center;
}

.buy {
    margin-top: 20px;
    padding: 12px 30px;
    border: 1px solid var(--rzr-green);
    background: transparent;
    color: var(--rzr-green);
    cursor: pointer;
}
.buy:hover {
    box-shadow: 0 0 20px var(--rzr-green);
}
</style>
</head>

<body>

<header>
    <div id="menu" onclick="openFAQ()">☰</div>

    <div id="logo">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPqpyPBcJpe-UHc6QtWnBrQg06tZydkj13BQ&s">
    </div>

    <div id="search">🔍</div>
</header>

<div id="loginWrap">
    <button id="loginBtn" onclick="location.href='login.html'">LOGIN</button>
</div>

<main>
    <div class="product" onclick="openProduct('pc')">
        <img src="https://assets2.razerzone.com/images/pnx.assets/16e2a1c7c246d5c088826fd52691a967/razer-tomahawk-gaming-desktop-hero-mobile-v2.jpg">
        <h2>RZR TITAN — DESKTOP</h2>
    </div>

    <div class="product" onclick="openProduct('laptop')">
        <img src="https://assets2.razerzone.com/images/pnx.assets/62fd0244762cde2b9ccabf21add45c99/blade16-2025-1200x-630.webp">
        <h2>RZR BLADE16 — LAPTOP</h2>
    </div>
</main>

<section id="brand">
    <h2>ABOUT RZR GAMING</h2>
    <p>
        RZR Gaming is a performance-first hardware brand built for extreme gaming,
        creative workloads, and next-generation systems.  
        Precision engineering. Aggressive thermals. No compromises.
    </p>
</section>

<!-- PRODUCT OVERLAY -->
<div class="overlay" id="productOverlay">
    <div class="overlay-content">
        <div class="close" onclick="closeOverlay()">✕</div>
        <div class="product-layout" id="productContent"></div>
    </div>
</div>

<script>
function openFAQ(){
    window.location.href = "faq.html";
}

function closeOverlay(){
    document.getElementById("productOverlay").style.display = "none";
}

function openProduct(type){
    const pc = `
        <img src="https://assets2.razerzone.com/images/pnx.assets/16e2a1c7c246d5c088826fd52691a967/razer-tomahawk-gaming-desktop-hero-mobile-v2.jpg">
        <div>
            <h1>RZR TITAN</h1>
            <p>Extreme desktop performance.</p>
            <button class="buy">BUY NOW</button>
        </div>
        <div class="specs">
            <div class="spec">RTX 4090</div>
            <div class="spec">Ryzen 9 7950X3D</div>
            <div class="spec">64GB DDR5</div>
            <div class="spec">4TB NVMe</div>
            <div class="spec">Liquid Cooling</div>
            <div class="spec">1200W PSU</div>
        </div>
    `;

    const laptop = `
        <img src="https://assets2.razerzone.com/images/pnx.assets/62fd0244762cde2b9ccabf21add45c99/blade16-2025-1200x-630.webp">
        <div>
            <h1>RZR PHANTOM</h1>
            <p>Portable power without compromise.</p>
            <button class="buy">BUY NOW</button>
        </div>
        <div class="specs">
            <div class="spec">RTX 4090 Laptop</div>
            <div class="spec">Intel i9-14900HX</div>
            <div class="spec">64GB DDR5</div>
            <div class="spec">2TB NVMe</div>
            <div class="spec">240Hz Mini-LED</div>
            <div class="spec">Vapor Chamber</div>
        </div>
    `;

    document.getElementById("productContent").innerHTML = type === "pc" ? pc : laptop;
    document.getElementById("productOverlay").style.display = "block";
}
</script>

</body>
</html>
