<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Authentication</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    width: 100%;
    height: 100%;
    background: black;
    color: #ff4444;
    font-family: Consolas, monospace;
    overflow: hidden;
}

/* ===== MATRIX BACKGROUND ===== */
#matrix {
    position: fixed;
    inset: 0;
    z-index: 1;
}

/* ===== CENTER PANEL ===== */
.panel {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
}

.box {
    width: 360px;
    border: 1px solid #aa0000;
    padding: 30px;
    background: rgba(0,0,0,0.85);
}

/* TEXT */
h1 {
    font-size: 18px;
    margin-bottom: 20px;
    text-align: center;
}

p {
    font-size: 14px;
    text-align: center;
    margin-bottom: 20px;
    opacity: 0.85;
}

/* INPUTS */
input {
    width: 100%;
    background: black;
    border: 1px solid #aa0000;
    color: #ff4444;
    padding: 8px;
    margin-bottom: 14px;
    font-family: Consolas, monospace;
}

/* BUTTONS */
button {
    width: 100%;
    background: black;
    border: 1px solid #ff4444;
    color: #ff4444;
    padding: 10px;
    cursor: pointer;
    font-family: Consolas, monospace;
}

button:hover {
    background: #220000;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<!-- CONFIRMATION PANEL -->
<div class="panel" id="confirmPanel">
    <div class="box">
        <h1>RESTRICTED ACCESS</h1>
        <p>Are you sure you want to proceed?</p>
        <button onclick="showLogin()">PROCEED</button>
    </div>
</div>

<!-- LOGIN PANEL -->
<div class="panel" id="loginPanel" style="display:none">
    <div class="box">
        <h1>AUTHENTICATION REQUIRED</h1>

        USERNAME
        <input id="user" autocomplete="off">

        PASSWORD
        <input id="pass" type="password">

        <button onclick="authenticate()">LOGIN</button>
    </div>
</div>

<script>
/* ================= MATRIX ================= */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%";
const size = 16;
const cols = Math.floor(innerWidth / size);
const drops = Array.from({length: cols}, () => Math.random() * innerHeight);

setInterval(() => {
    ctx.fillStyle = "rgba(0,0,0,0.12)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.font = size + "px monospace";

    drops.forEach((y,i)=>{
        ctx.fillStyle = Math.random()<0.08 ? "#ff2222" : "#00ff66";
        ctx.fillText(chars[Math.random()*chars.length|0], i*size, y);
        drops[i] = y > canvas.height ? 0 : y + size;
    });
}, 33);

/* ================= FLOW ================= */
function showLogin() {
    document.getElementById("confirmPanel").style.display = "none";
    document.getElementById("loginPanel").style.display = "flex";
}

function authenticate() {
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;

    if (u === "matei123_" && p === "12345") {
        // SUCCESS → MAP
        window.location.href = "map.html";
    } else {
        alert("ACCESS DENIED");
    }
}
</script>

</body>
</html>
